# Example sweep config for Nibi MBARI coarse detection.
# Default label plan is `coarse_v1_bio8`; set `label_plan` to
# `coarse_v1_bio8_plus_gear` if hardware/debris false positives matter.
# Replace `model` with a local checkpoint path if you want to fine-tune a
# staged FathomNet detector such as MBARI-315k YOLOv8.

global:
  repo: /home/merileo/yolo_segmentation
  venv: /home/merileo/yolo_segmentation/.venv
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  task: detect
  mode: coarse
  label_plan: coarse_v1_bio8
  label_plans_file: /home/merileo/yolo_segmentation/configs/label_plans.yaml
  top_n: 100
  val_ratio: 0.2
  split_seed: 0
  epochs: 100
  gpus_per_node: h100:1
  cpus_per_task: 6
  mem: 32000M
  wandb_project: yolo-detection-mbari-coarse
  wandb_group: nibi_detect_coarse_v1_2026_03
  wandb_tags: mbari,detection,coarse,nibi
  train:
    imgsz: 960
    optimizer: auto
    patience: 20
    lrf: 0.01
    save_period: -1
    seed: 0

experiments:
  - name: det_coarse8_yolo11m_b16_lr5e4_s0
    model: yolo11m.pt
    batch: 16
    train:
      lr0: 0.0005

  - name: det_coarse8_yolo11m_b16_lr1e3_s0
    model: yolo11m.pt
    batch: 16
    train:
      lr0: 0.001

  - name: det_coarse8_yolo11l_b12_lr5e4_s0
    model: yolo11l.pt
    batch: 12
    train:
      lr0: 0.0005

  - name: det_coarse8_yolo11l_b12_lr1e3_s0
    model: yolo11l.pt
    batch: 12
    train:
      lr0: 0.001
