# Example sweep config for Nibi MBARI binary detection.
# Replace `model` with a local checkpoint path if you want to fine-tune a staged
# FathomNet detector such as Megalodon or MBARI-315k YOLOv8.

global:
  repo: /home/merileo/yolo_segmentation
  venv: /home/merileo/yolo_segmentation/.venv
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  task: detect
  mode: binary
  top_n: 100
  val_ratio: 0.2
  split_seed: 42
  epochs: 100
  gpus_per_node: h100:1
  cpus_per_task: 6
  mem: 32000M
  wandb_project: yolo-detection-mbari-binary
  wandb_group: nibi_detect_binary_2026_03
  wandb_tags: mbari,detection,binary,nibi
  train:
    imgsz: 960
    optimizer: AdamW
    lrf: 0.01
    patience: 30
    save_period: 20

experiments:
  - name: det_bin_yolo11m_b16_lr5e4_s42
    model: yolo11m.pt
    batch: 16
    train:
      lr0: 0.0005
      seed: 42

  - name: det_bin_yolo11m_b16_lr1e3_s42
    model: yolo11m.pt
    batch: 16
    train:
      lr0: 0.001
      seed: 42

  - name: det_bin_yolo11l_b12_lr5e4_s42
    model: yolo11l.pt
    batch: 12
    train:
      lr0: 0.0005
      seed: 42

  - name: det_bin_yolo11l_b12_lr1e3_s42
    model: yolo11l.pt
    batch: 12
    train:
      lr0: 0.001
      seed: 42
