# Example sweep config for Nibi MBARI binary segmentation.
# Edit values as needed, then submit with:
#   python scripts/submit_sweep.py --config configs/nibi_sweep_binary.yaml --submit

global:
  repo: /home/merileo/yolo_segmentation
  venv: /home/merileo/yolo_segmentation/.venv
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  mode: binary
  top_n: 100
  val_ratio: 0.2
  split_seed: 42
  epochs: 100
  gpus_per_node: h100:1
  cpus_per_task: 6
  mem: 32000M
  wandb_project: yolo-segmentation-mbari-binary
  wandb_group: nibi_binary_2026_02
  wandb_tags: mbari,binary,nibi,sweep
  train:
    imgsz: 960
    optimizer: AdamW
    lrf: 0.01
    patience: 30
    save_period: 20

experiments:
  - name: bin_yolo11m_b10_lr5e4_s42
    model: yolo11m-seg.pt
    batch: 10
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11m_b10_lr1e3_s42
    model: yolo11m-seg.pt
    batch: 10
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11l_b8_lr5e4_s42
    model: yolo11l-seg.pt
    batch: 8
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11l_b8_lr1e3_s42
    model: yolo11l-seg.pt
    batch: 8
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11x_b6_lr5e4_s42
    model: yolo11x-seg.pt
    batch: 6
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11x_b6_lr1e3_s42
    model: yolo11x-seg.pt
    batch: 6
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11l_b8_lr5e4_s1337
    model: yolo11l-seg.pt
    batch: 8
    train:
      lr0: 0.0005
      seed: 1337

  - name: bin_yolo11x_b6_lr5e4_s1337
    model: yolo11x-seg.pt
    batch: 6
    train:
      lr0: 0.0005
      seed: 1337
