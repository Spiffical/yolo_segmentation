# Example sweep config for Nibi MBARI binary segmentation.
# Edit values as needed, then submit with:
#   python scripts/submit_sweep.py --config configs/nibi_sweep_binary.yaml --submit

global:
  repo: /project/def-kmoran/merileo/yolo_segmentation
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  mode: binary
  top_n: 100
  val_ratio: 0.2
  split_seed: 42
  epochs: 100
  gpus_per_node: 4
  wandb_project: yolo-segmentation-mbari-binary
  wandb_group: nibi_binary_2026_02
  wandb_tags: mbari,binary,nibi,sweep
  train:
    imgsz: 960
    optimizer: AdamW
    lrf: 0.01
    patience: 30
    save_period: 20

experiments:
  - name: bin_yolo11m_b40_lr5e4_s42
    model: yolo11m-seg.pt
    batch: 40
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11m_b40_lr1e3_s42
    model: yolo11m-seg.pt
    batch: 40
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11l_b32_lr5e4_s42
    model: yolo11l-seg.pt
    batch: 32
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11l_b32_lr1e3_s42
    model: yolo11l-seg.pt
    batch: 32
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11x_b24_lr5e4_s42
    model: yolo11x-seg.pt
    batch: 24
    train:
      lr0: 0.0005
      seed: 42

  - name: bin_yolo11x_b24_lr1e3_s42
    model: yolo11x-seg.pt
    batch: 24
    train:
      lr0: 0.001
      seed: 42

  - name: bin_yolo11l_b32_lr5e4_s1337
    model: yolo11l-seg.pt
    batch: 32
    train:
      lr0: 0.0005
      seed: 1337

  - name: bin_yolo11x_b24_lr5e4_s1337
    model: yolo11x-seg.pt
    batch: 24
    train:
      lr0: 0.0005
      seed: 1337
