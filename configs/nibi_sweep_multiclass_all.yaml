# Full multiclass sweep using all categories.
# Warning: 1897 classes is very long-tail and harder to train/stabilize.

global:
  repo: /home/merileo/yolo_segmentation
  venv: /home/merileo/yolo_segmentation/.venv
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  mode: all
  top_n: 100
  val_ratio: 0.2
  split_seed: 0
  epochs: 100
  gpus_per_node: h100:2
  wandb_project: yolo-segmentation-mbari-multiclass
  wandb_group: nibi_multiclass_all_2026_02
  wandb_tags: mbari,multiclass,all_classes,nibi
  train:
    imgsz: 640
    optimizer: auto
    patience: 5
    lrf: 0.01
    save_period: -1
    seed: 0

experiments:
  - name: mc_all_yolo11m_b8_lr1e2_s0
    model: yolo11m-seg.pt
    batch: 8
    train:
      lr0: 0.01

  - name: mc_all_yolo11l_b8_lr1e2_s0
    model: yolo11l-seg.pt
    batch: 8
    train:
      lr0: 0.01
