# Multiclass sweep using top-N categories.
# This is the recommended first multiclass experiment due to long-tail labels.

global:
  repo: /home/merileo/yolo_segmentation
  venv: /home/merileo/yolo_segmentation/.venv
  data: /project/def-kmoran/merileo/yolo_segmentation/data/mbari_raw.tar.gz
  mode: top_n
  top_n: 100
  val_ratio: 0.2
  split_seed: 0
  epochs: 100
  gpus_per_node: h100:1
  cpus_per_task: 6
  mem: 32000M
  wandb_project: yolo-segmentation-mbari-multiclass
  wandb_group: nibi_multiclass_topn_2026_02
  wandb_tags: mbari,multiclass,topn,nibi
  train:
    imgsz: 640
    optimizer: auto
    patience: 5
    lrf: 0.01
    save_period: -1
    seed: 0

experiments:
  - name: mc_top50_yolo11m_b8_lr1e2_s0
    model: yolo11m-seg.pt
    batch: 8
    top_n: 50
    train:
      lr0: 0.01

  - name: mc_top50_yolo11l_b8_lr1e2_s0
    model: yolo11l-seg.pt
    batch: 8
    top_n: 50
    train:
      lr0: 0.01

  - name: mc_top100_yolo11m_b8_lr1e2_s0
    model: yolo11m-seg.pt
    batch: 8
    top_n: 100
    train:
      lr0: 0.01

  - name: mc_top100_yolo11l_b8_lr1e2_s0
    model: yolo11l-seg.pt
    batch: 8
    top_n: 100
    train:
      lr0: 0.01

  - name: mc_top200_yolo11m_b6_lr1e2_s0
    model: yolo11m-seg.pt
    batch: 6
    top_n: 200
    train:
      lr0: 0.01

  - name: mc_top200_yolo11l_b6_lr1e2_s0
    model: yolo11l-seg.pt
    batch: 6
    top_n: 200
    train:
      lr0: 0.01
